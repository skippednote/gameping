# Built-in game → region map.
#
# Override or extend with ~/.config/gameping/games.toml (same format).
# A game in the user file with the same `id` replaces the built-in one.
#
# `src` formats:
#   icmp:<host>            ICMP echo to a host (direct game beacon/relay)
#   tcp:<host>:<port>      TCP connect time
#   aws:<region>           TCP connect to the AWS regional endpoint (proxy)
#   gcp:<region>           HTTPS round trip to a Cloud Run service via gcping.com (proxy)
#   valve:*                every Valve SDR relay POP outside China (direct, fetched live)
#   valve:all              every Valve SDR relay POP including China-only ones
#   valve:<pop>            one Valve POP, e.g. valve:bom2
#
# `direct = true` marks measurements against the game's own infrastructure.
# Everything else is an estimate: latency to the cloud region the game runs in.

[[game]]
id = "fortnite"
name = "Fortnite"
targets = [
  { region = "Asia (Tokyo)",          src = "icmp:ping-asia.ds.on.epicgames.com", direct = true },
  { region = "Middle East (Bahrain)", src = "icmp:ping-me.ds.on.epicgames.com",   direct = true },
  { region = "Europe",                src = "icmp:ping-eu.ds.on.epicgames.com",   direct = true },
  { region = "NA East",               src = "icmp:ping-nae.ds.on.epicgames.com",  direct = true },
  { region = "NA Central",            src = "icmp:ping-nac.ds.on.epicgames.com",  direct = true },
  { region = "NA West",               src = "icmp:ping-naw.ds.on.epicgames.com",  direct = true },
  { region = "Oceania",               src = "icmp:ping-oce.ds.on.epicgames.com",  direct = true },
  { region = "Brazil",                src = "icmp:ping-br.ds.on.epicgames.com",   direct = true },
]

